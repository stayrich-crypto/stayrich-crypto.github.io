<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f7931a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b0b1a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="85" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(255,215,0,0.1)" stroke-width="1" />
  <!-- Inner Coin Icon: Crypto "S" -->
  <text x="100" y="128" font-family="'Arial Black', sans-serif" font-size="80" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" filter="url(#glow)">₿</text>
  <!-- Small star decorations -->
  <text x="40" y="45" font-size="18" fill="#ffd700" opacity="0.6">✦</text>
  <text x="155" y="45" font-size="14" fill="#ffd700" opacity="0.4">✦</text>
  <text x="30" y="155" font-size="12" fill="#ffd700" opacity="0.3">✦</text>
  <text x="165" y="160" font-size="16" fill="#ffd700" opacity="0.5">✦</text>
  <!-- Text: StayRich Crypto -->
  <text x="230" y="88" font-family="'Segoe UI', 'Arial', sans-serif" font-size="46" font-weight="800" fill="url(#goldGrad)" letter-spacing="1">StayRich</text>
  <text x="230" y="130" font-family="'Segoe UI', 'Arial', sans-serif" font-size="24" font-weight="300" fill="#a0a0b0" letter-spacing="4">CRYPTO</text>
  <!-- Tagline -->
  <text x="230" y="162" font-family="'Segoe UI', 'Arial', sans-serif" font-size="12" fill="rgba(255,215,0,0.4)" letter-spacing="6">DONATE · SUPPORT · BUILD</text>
</svg>