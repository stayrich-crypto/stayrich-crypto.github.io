<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f7931a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b0b1a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#darkGrad)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(255,215,0,0.08)" stroke-width="2" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.3" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="8 8" opacity="0.2" />

  <circle cx="256" cy="256" r="110" fill="rgba(255,215,0,0.05)" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="256" y="315" font-family="'Arial Black', sans-serif" font-size="160" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" filter="url(#glow)">₿</text>

  <text x="256" y="60" font-size="28" fill="#ffd700" opacity="0.5" text-anchor="middle">✦</text>
  <text x="256" y="465" font-size="24" fill="#ffd700" opacity="0.3" text-anchor="middle">✦</text>
  <text x="65" y="256" font-size="26" fill="#ffd700" opacity="0.4" text-anchor="middle">✦</text>
  <text x="447" y="256" font-size="26" fill="#ffd700" opacity="0.4" text-anchor="middle">✦</text>
  <text x="120" y="100" font-size="16" fill="#ffd700" opacity="0.2">✦</text>
  <text x="390" y="100" font-size="16" fill="#ffd700" opacity="0.2">✦</text>
  <text x="120" y="420" font-size="16" fill="#ffd700" opacity="0.2">✦</text>
  <text x="390" y="420" font-size="16" fill="#ffd700" opacity="0.2">✦</text>
</svg>